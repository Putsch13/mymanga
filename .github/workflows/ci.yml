name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    name: Lint · Types · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @manga-ai-studio/db exec prisma generate
      - run: pnpm --filter @manga-ai-studio/web exec tsc --noEmit
      - run: pnpm --filter @manga-ai-studio/ai test --run
      - run: pnpm --filter @manga-ai-studio/core test --run
      - run: pnpm --filter @manga-ai-studio/workflow test --run
      - run: pnpm --filter @manga-ai-studio/web test --run
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
  build:
    name: Build prod
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @manga-ai-studio/db exec prisma generate
      - run: pnpm --filter @manga-ai-studio/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_APP_URL: https://mymanga.onrender.com
