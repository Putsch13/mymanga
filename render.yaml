# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: manga-ai-studio-web
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: .
    buildCommand: npm install -g pnpm@10.33.0 && pnpm install --frozen-lockfile && pnpm --filter @manga-ai-studio/db exec prisma generate && pnpm --filter @manga-ai-studio/web build
    startCommand: pnpm --filter @manga-ai-studio/web start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: INNGEST_EVENT_KEY
        sync: false
      - key: INNGEST_SIGNING_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: BFL_API_KEY
        sync: false
      - key: RUNWARE_API_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TEXT_MODEL
        sync: false
      - key: OPENAI_STRUCTURED_MODEL
        sync: false
      - key: OPENAI_IMAGE_MODEL
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        sync: false
      - key: OPENAI_MODERATION_MODEL
        sync: false
      - key: POSTHOG_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: AUTH_DISABLED
        sync: false
